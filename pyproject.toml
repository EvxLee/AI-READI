[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aireadi"
version = "0.1.0"
description = "Shared data layer for the UCSF Tech Lab AI-READI analyses"
requires-python = ">=3.10"
dependencies = [
    # Capped below 3.0 for reproducibility across the results freeze -- see
    # the note in requirements.txt.
    "pandas>=2.0.0,<3.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "python-dotenv>=1.0.0",
    "azure-storage-blob>=12.19.0",
]

[tool.setuptools.packages.find]
where = ["src"]
